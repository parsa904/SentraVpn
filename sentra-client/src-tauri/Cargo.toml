[package]
name = "sentra-connect"
version = "1.0.0"
description = "Sentra Connect - Sleek, Windscribe-inspired Anti-Censorship Client"
authors = ["Sentra Systems Engineering"]
edition = "2021"

[lib]
name = "sentra_connect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", default-features = false , features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-sentra-vpn = { path = "plugins/sentra-vpn" }
