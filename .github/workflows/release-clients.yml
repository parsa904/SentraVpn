name: Release SentraVPN Clients (Android & Windows)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

concurrency:
  group: release-clients-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_API_BASE_URL: https://sentra-core.kziepr.workers.dev
  SENTRA_API_BASE_URL: https://sentra-core.kziepr.workers.dev
  SINGBOX_FALLBACK_VERSION: 1.12.12

jobs:
  health-checks:
    name: Code Health, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.resolve-version.outputs.release_tag }}
      app_version: ${{ steps.resolve-version.outputs.app_version }}
      version_code: ${{ steps.resolve-version.outputs.version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version metadata
        id: resolve-version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ inputs.version }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          RAW_TAG="${RAW_TAG#refs/tags/}"
          if [[ "$RAW_TAG" != v* ]]; then
            RAW_TAG="v${RAW_TAG}"
          fi
          APP_VER="${RAW_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH_RAW <<< "$APP_VER"
          PATCH="${PATCH_RAW%%-*}"
          MAJOR="${MAJOR:-1}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "release_tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VER}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved release: tag=${RAW_TAG}, app_version=${APP_VER}, version_code=${VERSION_CODE}"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck & Lint Sentra Client
        run: npm run typecheck --workspace=sentra-connect

      - name: Run Client & Cloudflare Worker Unit Tests
        run: npm run test

      - name: Verify Production Web Bundle Build
        run: npm run build --workspace=sentra-connect

  build-android:
    name: Build Android APKs (Universal, ARMv8, ARMv7, x64)
    needs: health-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SENTRY_DSN_CLIENT: ${{ secrets.SENTRY_DSN_CLIENT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Configure Android environment variables
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust & Gradle dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sentra-client/src-tauri

      - name: Install dependencies & Tauri CLI v2
        run: |
          npm ci
          npm install --no-save @tauri-apps/cli@2

      - name: Sync version into client configs
        shell: bash
        env:
          APP_VER: ${{ needs.health-checks.outputs.app_version }}
        run: |
          node -e '
            const fs = require("fs");
            const ver = process.env.APP_VER;
            const confPath = "sentra-client/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(confPath, "utf8"));
            conf.version = ver;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + "\n");
            const cargoPath = "sentra-client/src-tauri/Cargo.toml";
            const cargo = fs.readFileSync(cargoPath, "utf8").replace(/^version = ".*"$/m, `version = "${ver}"`);
            fs.writeFileSync(cargoPath, cargo);
          '

      - name: Bundle sing-box native Android binaries (arm64-v8a, armeabi-v7a, x86_64)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          JNI_BASE="sentra-client/src-tauri/gen/android/app/src/main/jniLibs"
          mkdir -p "$JNI_BASE/arm64-v8a" "$JNI_BASE/armeabi-v7a" "$JNI_BASE/x86_64"

          LATEST_TAG=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/SagerNet/sing-box/releases/latest" \
            | node -e 'const d = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log((d.tag_name || "").replace(/^v/, ""));' || true)
          SB_VER="${LATEST_TAG:-$SINGBOX_FALLBACK_VERSION}"
          echo "Using sing-box version: ${SB_VER}"

          download_arch() {
            local sb_arch="$1"
            local abi_dir="$2"
            local url="https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-android-${sb_arch}.tar.gz"
            local fallback_url="https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-${sb_arch}.tar.gz"
            local tmpdir
            tmpdir=$(mktemp -d)
            if curl -fsSL "$url" -o "$tmpdir/sb.tar.gz" || curl -fsSL "$fallback_url" -o "$tmpdir/sb.tar.gz"; then
              tar -xzf "$tmpdir/sb.tar.gz" -C "$tmpdir"
              local bin_path
              bin_path=$(find "$tmpdir" -type f -name "sing-box" | head -n 1)
              if [ -n "$bin_path" ]; then
                cp "$bin_path" "$JNI_BASE/$abi_dir/libsingbox.so"
                chmod +x "$JNI_BASE/$abi_dir/libsingbox.so"
                echo "Bundled sing-box for $abi_dir ($(stat -c%s "$JNI_BASE/$abi_dir/libsingbox.so") bytes)"
              fi
            else
              echo "::warning::Could not download prebuilt sing-box for $abi_dir; continuing build."
            fi
            rm -rf "$tmpdir"
          }

          download_arch "arm64" "arm64-v8a"
          download_arch "armv7" "armeabi-v7a"
          download_arch "amd64" "x86_64"

      - name: Prepare Android release signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/sentra-client/src-tauri/gen/android/release.keystore"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            STORE_PASS="${KEYSTORE_PASSWORD}"
            ALIAS="${KEY_ALIAS}"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "Using repository secret Android release keystore."
          else
            STORE_PASS="sentra-release-ci-keystore"
            ALIAS="sentra"
            KEY_PASS="sentra-release-ci-keystore"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=SentraVPN, OU=Mobile, O=SentraVPN, L=Global, ST=Global, C=US"
            echo "Generated ephemeral release signing keystore (configure ANDROID_KEYSTORE_BASE64 secret for persistent signing)."
          fi

          cat > sentra-client/src-tauri/gen/android/keystore.properties <<EOF
          storeFile=${KEYSTORE_FILE}
          storePassword=${STORE_PASS}
          keyAlias=${ALIAS}
          keyPassword=${KEY_PASS}
          EOF

      - name: Build production frontend bundle
        run: npm run build --workspace=sentra-connect

      - name: Compile Rust Android libraries & Gradle APKs (Universal, ARMv8, ARMv7, x64)
        working-directory: sentra-client
        env:
          APP_VER: ${{ needs.health-checks.outputs.app_version }}
          VER_CODE: ${{ needs.health-checks.outputs.version_code }}
        run: |
          set -euo pipefail
          npx tauri android build --apk \
            --target aarch64 \
            --target armv7 \
            --target x86_64

          cd src-tauri/gen/android
          chmod +x gradlew
          ./gradlew \
            assembleUniversalRelease \
            assembleArm64Release \
            assembleArmRelease \
            assembleX86_64Release \
            -PversionName="${APP_VER}" \
            -PversionCode="${VER_CODE}" \
            -PabiList="arm64-v8a,armeabi-v7a,x86_64" \
            -ParchList="arm64,arm,x86_64" \
            -PtargetList="aarch64,armv7,x86_64" \
            --no-daemon

      - name: Collect and rename exact Android release APKs
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/release-android"
          APK_ROOT="sentra-client/src-tauri/gen/android/app/build/outputs/apk"
          mkdir -p "$OUT_DIR"

          copy_apk() {
            local flavor="$1"
            local target_name="$2"
            local found
            found=$(find "$APK_ROOT/$flavor/release" -type f -name "*.apk" ! -name "*-unsigned.apk" | head -n 1 || true)
            if [ -z "$found" ]; then
              found=$(find "$APK_ROOT/$flavor/release" -type f -name "*.apk" | head -n 1 || true)
            fi
            if [ -z "$found" ]; then
              echo "::error::Expected APK for flavor '$flavor' was not found under $APK_ROOT/$flavor/release"
              find "$APK_ROOT" -type f || true
              exit 1
            fi
            cp "$found" "$OUT_DIR/$target_name"
            echo "Prepared $target_name ($(stat -c%s "$OUT_DIR/$target_name") bytes)"
          }

          copy_apk "universal" "SentraVPN-Android-Universal.apk"
          copy_apk "arm64" "SentraVPN-Android-ARMv8.apk"
          copy_apk "arm" "SentraVPN-Android-ARMv7.apk"
          copy_apk "x86_64" "SentraVPN-Android-x64.apk"

          ls -lh "$OUT_DIR"

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sentravpn-android-apks
          path: release-android/*.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows x64 (Setup NSIS & Portable ZIP)
    needs: health-checks
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      SENTRY_DSN_CLIENT: ${{ secrets.SENTRY_DSN_CLIENT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sentra-client/src-tauri

      - name: Install dependencies & Tauri CLI v2
        shell: pwsh
        run: |
          npm ci
          npm install --no-save @tauri-apps/cli@2

      - name: Sync version into client configs
        shell: pwsh
        env:
          APP_VER: ${{ needs.health-checks.outputs.app_version }}
        run: |
          node -e '
            const fs = require("fs");
            const ver = process.env.APP_VER;
            const confPath = "sentra-client/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(confPath, "utf8"));
            conf.version = ver;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + "\n");
            const cargoPath = "sentra-client/src-tauri/Cargo.toml";
            const cargo = fs.readFileSync(cargoPath, "utf8").replace(/^version = ".*"$/m, `version = "${ver}"`);
            fs.writeFileSync(cargoPath, cargo);
          '

      - name: Download sing-box Windows x64 sidecar binary
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $binDir = "sentra-client/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null

          $sbVer = $env:SINGBOX_FALLBACK_VERSION
          try {
            $headers = @{ "Authorization" = "Bearer $env:GH_TOKEN"; "User-Agent" = "SentraVPN-Release" }
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/SagerNet/sing-box/releases/latest" -Headers $headers
            if ($rel.tag_name) {
              $sbVer = $rel.tag_name.TrimStart("v")
            }
          } catch {
            Write-Host "Falling back to pinned sing-box version $sbVer"
          }

          $zipUrl = "https://github.com/SagerNet/sing-box/releases/download/v$sbVer/sing-box-$sbVer-windows-amd64.zip"
          $zipPath = "$env:RUNNER_TEMP\sing-box-win.zip"
          $extractDir = "$env:RUNNER_TEMP\sing-box-win"
          Write-Host "Downloading $zipUrl ..."
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force

          $sbExe = Get-ChildItem -Path $extractDir -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          if (-not $sbExe) {
            throw "sing-box.exe was not found inside downloaded archive"
          }

          $targetSidecar = Join-Path $binDir "sing-box-x86_64-pc-windows-msvc.exe"
          Copy-Item -Path $sbExe.FullName -Destination $targetSidecar -Force
          Write-Host "Bundled Windows sidecar: $targetSidecar ($((Get-Item $targetSidecar).Length) bytes)"

      - name: Build Windows Setup x64 (NSIS) via Tauri v2
        working-directory: sentra-client
        shell: pwsh
        run: |
          npx tauri build --bundles nsis --target x86_64-pc-windows-msvc

      - name: Package exact Windows Setup x64 & Portable x64 artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = Join-Path $env:GITHUB_WORKSPACE "release-windows"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # 1. Setup x64 (NSIS installer)
          $nsisDir = "sentra-client/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installer = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            $installer = Get-ChildItem -Path $nsisDir -Filter "*.exe" | Select-Object -First 1
          }
          if (-not $installer) {
            throw "NSIS installer executable not found in $nsisDir"
          }
          $setupOut = Join-Path $outDir "SentraVPN-Windows-Setup-x64.exe"
          Copy-Item -Path $installer.FullName -Destination $setupOut -Force
          Write-Host "Prepared SentraVPN-Windows-Setup-x64.exe ($((Get-Item $setupOut).Length) bytes)"

          # 2. Portable x64 ZIP (self-contained exe + bundled sing-box.exe)
          $releaseDir = "sentra-client/src-tauri/target/x86_64-pc-windows-msvc/release"
          $mainExe = Get-ChildItem -Path $releaseDir -Filter "*.exe" | Where-Object { $_.Name -notlike "*uninstall*" } | Select-Object -First 1
          if (-not $mainExe) {
            throw "Compiled Windows executable not found in $releaseDir"
          }
          $portableStage = Join-Path $env:RUNNER_TEMP "SentraVPN-Windows-Portable-x64"
          if (Test-Path $portableStage) { Remove-Item -Recurse -Force $portableStage }
          New-Item -ItemType Directory -Force -Path $portableStage | Out-Null

          Copy-Item -Path $mainExe.FullName -Destination (Join-Path $portableStage "SentraVPN.exe") -Force
          Copy-Item -Path "sentra-client/src-tauri/binaries/sing-box-x86_64-pc-windows-msvc.exe" -Destination (Join-Path $portableStage "sing-box.exe") -Force

          @(
            "SentraVPN Portable (Windows x64)",
            "=================================",
            "1. Extract the entire folder before launching.",
            "2. Run SentraVPN.exe (keep sing-box.exe in the same folder).",
            "3. Get your subscription / login code from Telegram: https://t.me/sentraconnect_bot"
          ) | Set-Content -Path (Join-Path $portableStage "README.txt") -Encoding UTF8

          $portableZip = Join-Path $outDir "SentraVPN-Windows-Portable-x64.zip"
          Compress-Archive -Path "$portableStage\*" -DestinationPath $portableZip -Force
          Write-Host "Prepared SentraVPN-Windows-Portable-x64.zip ($((Get-Item $portableZip).Length) bytes)"

          Get-ChildItem -Path $outDir

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sentravpn-windows-x64
          path: |
            release-windows/SentraVPN-Windows-Setup-x64.exe
            release-windows/SentraVPN-Windows-Portable-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release (Android & Windows)
    needs: [health-checks, build-android, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: sentravpn-android-apks
          path: release-dist

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: sentravpn-windows-x64
          path: release-dist

      - name: Verify all 6 release binaries & generate SHA256SUMS.txt
        working-directory: release-dist
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED_FILES=(
            "SentraVPN-Android-Universal.apk"
            "SentraVPN-Android-ARMv8.apk"
            "SentraVPN-Android-ARMv7.apk"
            "SentraVPN-Android-x64.apk"
            "SentraVPN-Windows-Setup-x64.exe"
            "SentraVPN-Windows-Portable-x64.zip"
          )
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty release artifact: $f"
              exit 1
            fi
          done
          sha256sum "${REQUIRED_FILES[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.health-checks.outputs.release_tag }}
          name: SentraVPN ${{ needs.health-checks.outputs.release_tag }}
          make_latest: true
          generate_release_notes: true
          body: |
            ## 🛡️ SentraVPN ${{ needs.health-checks.outputs.release_tag }}

            انتشار رسمی اپلیکیشن‌های **اندروید** و **ویندوز** SentraVPN:

            ### 📱 Android
            - `SentraVPN-Android-Universal.apk` — مناسب تمام گوشی‌ها و تبلت‌های اندروید (پیشنهادی)
            - `SentraVPN-Android-ARMv8.apk` — مناسب گوشی‌های ۶۴ بیتی جدید (حجم کمتر)
            - `SentraVPN-Android-ARMv7.apk` — مناسب گوشی‌های ۳۲ بیتی قدیمی‌تر
            - `SentraVPN-Android-x64.apk` — مناسب دستگاه‌ها و شبیه‌سازهای x86_64

            ### 💻 Windows
            - `SentraVPN-Windows-Setup-x64.exe` — نسخه نصبی رسمی ویندوز ۶۴ بیتی
            - `SentraVPN-Windows-Portable-x64.zip` — نسخه پرتابل بدون نیاز به نصب (ویندوز ۶۴ بیتی)

            ### 🔐 راستی‌آزمایی فایل‌ها
            فایل `SHA256SUMS.txt` جهت بررسی اصالت تمام فایل‌ها پیوست شده است.

            ربات رسمی تلگرام جهت دریافت اشتراک: [@sentraconnect_bot](https://t.me/sentraconnect_bot)
          files: |
            release-dist/SentraVPN-Android-Universal.apk
            release-dist/SentraVPN-Android-ARMv8.apk
            release-dist/SentraVPN-Android-ARMv7.apk
            release-dist/SentraVPN-Android-x64.apk
            release-dist/SentraVPN-Windows-Setup-x64.exe
            release-dist/SentraVPN-Windows-Portable-x64.zip
            release-dist/SHA256SUMS.txt

      - name: Sync release binaries & Telegram file_id to Sentra Worker
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.health-checks.outputs.release_tag }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_RELEASE_CHANNEL_ID: ${{ secrets.TELEGRAM_RELEASE_CHANNEL_ID || secrets.ADMIN_TELEGRAM_ID }}
          QUALITY_ENGINE_SECRET: ${{ secrets.QUALITY_ENGINE_SECRET }}
          SENTRA_API_BASE_URL: ${{ vars.SENTRA_API_BASE_URL || 'https://sentra-core.kziepr.workers.dev' }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MAX_TG_BYTES=50331648 # 48 MB safe cap under Telegram's 50 MB Bot API limit
          WORKER_BASE="${SENTRA_API_BASE_URL%/}"

          if [ -z "${QUALITY_ENGINE_SECRET:-}" ]; then
            echo "::warning::QUALITY_ENGINE_SECRET is not configured; skipping Worker /api/v1/releases/sync."
            exit 0
          fi

          sync_platform() {
            local platform="$1"
            local file_path="$2"
            local file_name="$3"
            local github_url="https://github.com/${GITHUB_REPO}/releases/download/${RELEASE_TAG}/${file_name}"
            local tg_file_id=""

            if [ -f "$file_path" ]; then
              local file_size
              file_size=$(stat -c%s "$file_path")
              echo "[ReleaseSync] ${platform}: ${file_name} (${file_size} bytes)"

              if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_RELEASE_CHANNEL_ID:-}" ]; then
                if [ "$file_size" -lt "$MAX_TG_BYTES" ]; then
                  local tg_resp
                  tg_resp=$(curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                    -F "chat_id=${TELEGRAM_RELEASE_CHANNEL_ID}" \
                    -F "caption=SentraVPN ${RELEASE_TAG} (${platform})" \
                    -F "document=@${file_path}" || true)
                  if [ -n "$tg_resp" ]; then
                    tg_file_id=$(node -e "
                      try {
                        const j = JSON.parse(process.argv[1]);
                        if (j.ok && j.result && j.result.document && j.result.document.file_id) {
                          process.stdout.write(j.result.document.file_id);
                        }
                      } catch {}
                    " "$tg_resp")
                  fi
                  if [ -n "$tg_file_id" ]; then
                    echo "[ReleaseSync] Uploaded ${platform} to Telegram (file_id captured)."
                  else
                    echo "::warning::Telegram sendDocument did not return a file_id for ${platform}."
                  fi
                else
                  echo "::warning::${file_name} is >= 48 MB (${file_size} bytes); skipping Telegram upload and syncing GitHub URL only."
                fi
              else
                echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_RELEASE_CHANNEL_ID not set; syncing GitHub URL without file_id."
              fi
            fi

            local payload
            payload=$(node -e "
              const body = {
                platform: process.argv[1],
                version: process.argv[2],
                github_url: process.argv[3],
                telegram_file_id: process.argv[4] || null,
              };
              process.stdout.write(JSON.stringify(body));
            " "$platform" "$RELEASE_TAG" "$github_url" "$tg_file_id")

            curl -fsS -X POST "${WORKER_BASE}/api/v1/releases/sync" \
              -H "Content-Type: application/json" \
              -H "X-Quality-Secret: ${QUALITY_ENGINE_SECRET}" \
              -d "$payload" >/dev/null && \
              echo "[ReleaseSync] Synced ${platform} (${RELEASE_TAG}) to Worker D1." || \
              echo "::warning::Worker /api/v1/releases/sync failed for ${platform}."
          }

          sync_platform "android" "release-dist/SentraVPN-Android-Universal.apk" "SentraVPN-Android-Universal.apk"
          sync_platform "windows" "release-dist/SentraVPN-Windows-Setup-x64.exe" "SentraVPN-Windows-Setup-x64.exe"
