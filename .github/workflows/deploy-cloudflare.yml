name: Deploy Sentra Cloudflare Worker & D1

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/scripts/verify-env.ts'
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    name: Test, Migrate D1 & Deploy Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package.json

      - name: Install Cloudflare Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run Compiler & Outbound Analyzer unit tests
        run: npm test

      - name: Verify mandatory Worker environment variables
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          QUALITY_ENGINE_SECRET: ${{ secrets.QUALITY_ENGINE_SECRET }}
        run: node --experimental-strip-types .github/scripts/verify-env.ts

      - name: Apply Cloudflare D1 database schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute sentra-db --remote --yes --file=./schema.sql

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Sync Worker Secrets to Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          QUALITY_ENGINE_SECRET: ${{ secrets.QUALITY_ENGINE_SECRET }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
        run: |
          set -euo pipefail
          sync_secret() {
            local key="$1"
            local val="${!key:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$key"
            else
              echo "::warning::GitHub Secret ${key} is not set; skipping sync for ${key}."
            fi
          }

          sync_secret TELEGRAM_BOT_TOKEN
          sync_secret TELEGRAM_WEBHOOK_SECRET
          sync_secret QUALITY_ENGINE_SECRET

          if [ -n "${ADMIN_CHAT_ID:-}" ]; then
            printf '%s' "$ADMIN_CHAT_ID" | npx wrangler secret put ADMIN_CHAT_ID
          fi
          if [ -n "${ADMIN_TELEGRAM_IDS:-}" ]; then
            printf '%s' "$ADMIN_TELEGRAM_IDS" | npx wrangler secret put ADMIN_TELEGRAM_IDS
          fi
