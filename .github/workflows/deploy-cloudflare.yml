name: Deploy Sentra Cloudflare Worker & D1

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    name: Test, Migrate D1 & Deploy Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package.json

      - name: Install Cloudflare Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run Compiler & Outbound Analyzer unit tests
        run: npm test

      - name: Apply Cloudflare D1 database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply sentra-db --remote

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
