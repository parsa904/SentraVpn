name: Sentra QualityEngine (Node Health & sing-box 1.14+ Verification)

on:
  schedule:
    # Runs automatically every 30 minutes to optimize free GitHub Actions quota
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: sentra-quality-engine
  cancel-in-progress: true

permissions:
  contents: read

env:
  SINGBOX_VERSION: '1.14.0'
  SINGBOX_CACHE_DIR: /tmp/sentra-singbox-cache

jobs:
  quality-check:
    name: Probe Active Nodes & Run 2-Stage sing-box 1.14+ Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache official sing-box 1.14+ binary
        id: cache-singbox
        uses: actions/cache@v4
        with:
          path: ${{ env.SINGBOX_CACHE_DIR }}
          key: sentra-singbox-${{ runner.os }}-amd64-v${{ env.SINGBOX_VERSION }}

      - name: Install sing-box 1.14+ (from cache or official release)
        run: |
          set -euo pipefail
          mkdir -p "${SINGBOX_CACHE_DIR}"
          CACHED_BIN="${SINGBOX_CACHE_DIR}/sing-box"
          if [ ! -x "${CACHED_BIN}" ]; then
            TARGET_VER="${SINGBOX_VERSION}"
            ARCHIVE="sing-box-${TARGET_VER}-linux-amd64.tar.gz"
            URL="https://github.com/SagerNet/sing-box/releases/download/v${TARGET_VER}/${ARCHIVE}"
            if ! curl -fsSL "${URL}" -o "/tmp/${ARCHIVE}"; then
              echo "Version v${TARGET_VER} archive not found; resolving latest 1.14+ release from GitHub API..."
              LATEST_TAG="$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases \
                | node -e "const d = JSON.parse(require('fs').readFileSync(0,'utf8')); const r = d.find(x => /^v1\.1[4-9]\./.test(x.tag_name) && !x.draft) || d.find(x => !x.draft && !x.prerelease); console.log((r?.tag_name || 'v1.14.0').replace(/^v/, ''));")"
              TARGET_VER="${LATEST_TAG}"
              ARCHIVE="sing-box-${TARGET_VER}-linux-amd64.tar.gz"
              curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${TARGET_VER}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
            fi
            tar -xzf "/tmp/${ARCHIVE}" -C /tmp
            install -m 0755 "/tmp/sing-box-${TARGET_VER}-linux-amd64/sing-box" "${CACHED_BIN}"
            rm -rf "/tmp/${ARCHIVE}" "/tmp/sing-box-${TARGET_VER}-linux-amd64"
          fi
          sudo install -m 0755 "${CACHED_BIN}" /usr/local/bin/sing-box
          sing-box version

      - name: Execute QualityEngine 2-Stage Validation & Health Check
        env:
          SENTRA_WORKER_URL: ${{ secrets.SENTRA_WORKER_URL || 'https://sentra-core.kziepr.workers.dev' }}
          QUALITY_ENGINE_SECRET: ${{ secrets.QUALITY_ENGINE_SECRET }}
          QUALITY_CONCURRENCY: '6'
          SINGBOX_BIN: /usr/local/bin/sing-box
        run: node --experimental-strip-types .github/scripts/quality-check.ts
