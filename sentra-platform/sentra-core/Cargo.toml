[package]
name = "sentra-core"
version = "0.1.0"
edition = "2021"
authors = ["Sentra Systems Engineering"]
description = "High-performance backend and Telegram Bot daemon for Sentra Anti-Censorship Platform"

[dependencies]
# Async runtime & HTTP server
tokio = { version = "1.39", features = ["full"] }
axum = { version = "0.7", features = ["macros", "json"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database (SQLite with SQLx)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "macros"] }

# Telegram Bot & Networking (reqwest aligned to 0.11 for teloxide 0.13 compatibility)
teloxide = { version = "0.13", features = ["macros"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "socks"] }

# Serialization & Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
base64 = "0.22"
rand = "0.8"

# Error Handling & Tracing
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
