name = "sentra-core"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Cloudflare D1 Database Binding
# Create database once with: wrangler d1 create sentra-db
# Then replace database_id below (or set via CI environment override).
[[d1_databases]]
binding = "DB"
database_name = "sentra-db"
database_id = "f1f48cc6-f965-4bf0-8670-8cb0248f8e99"
migrations_dir = "migrations"

# Cloudflare KV Namespace Binding (L2 Global Cache for shared nodes & topic settings)
[[kv_namespaces]]
binding = "SENTRA_KV"
id = "6d0cba5038bb4057915891b2112ba196"

[vars]
BOT_USERNAME = "sentraconnect_bot"
PRO_SUBSCRIPTION_PRICE = "150000"
PUBLIC_BASE_URL = "https://sentra-core.kziepr.workers.dev"
ALLOWED_ORIGINS = ""
WIREGUARD_PORT = "51820"

# Configure the following secrets via `wrangler secret put <NAME>` (or synced automatically via GitHub Actions):
# - TELEGRAM_BOT_TOKEN        (Telegram Bot API token)
# - TELEGRAM_WEBHOOK_SECRET   (Random secret string set in setWebhook secret_token)
# - QUALITY_ENGINE_SECRET     (Shared secret for GitHub Actions QualityEngine endpoints)
# - ADMIN_TELEGRAM_ID         (Optional: Primary Telegram numeric admin ID; also supports ADMIN_CHAT_ID / ADMIN_TELEGRAM_IDS)
# - ADMIN_CHAT_ID             (Optional: Legacy Telegram numeric admin chat ID; or comma-separated ADMIN_TELEGRAM_IDS)
# - WIREGUARD_SERVER_PUBLIC_KEY
# - WIREGUARD_KEY_SALT
# - SENTRY_DSN_WORKER         (Optional: Sentry DSN for lightweight Worker Envelope error reporting)
# - TURSO_DATABASE_URL        (Optional: libsql:// or https:// Turso database URL for telemetry & D1 cloud mirror)
# - TURSO_AUTH_TOKEN          (Optional: Turso auth token for HTTP Pipeline API)

[triggers]
crons = ["0 */12 * * *"]

